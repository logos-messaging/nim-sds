name: 'Set up Nimble'
description: 'Install the pinned Nimble, then resolve the locked dependencies.'

inputs:
  repo-token:
    description: 'GITHUB_TOKEN, used to avoid API rate limits while resolving the Nimble release.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # The Nimble bundled with Nim resolves installDirs against srcDir, so a
    # dependent that installs this package gets no library/.
    - uses: nim-lang/setup-nimble-action@v2
      with:
        nimble-version: '0.26.0'
        repo-token: ${{ inputs.repo-token }}

    - name: Enable Git long paths
      if: runner.os == 'Windows'
      shell: bash
      run: git config --system core.longpaths true

    - name: Use a long profile path
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $p = "D:\lp\" + ("p" * 100)
        New-Item -ItemType Directory -Force -Path $p | Out-Null
        "USERPROFILE=$p" >> $env:GITHUB_ENV

    - name: Install dependencies
      shell: bash
      run: nimble setup -l
