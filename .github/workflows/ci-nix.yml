name: ci / nix
permissions:
  contents: read
on:
  pull_request:
    branches: [master, release/*]
  push:
    branches: [master, release/*]
  workflow_dispatch:

jobs:
  deps:
    name: 'deps.nix in sync with nimble.lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check nix/deps.nix
        run: ./tools/check-nix-deps.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - x86_64-linux
        nixpkg:
          - libsds
          - libsds-android-arm64
          - libsds-android-amd64
          - libsds-android-x86
          - libsds-android-arm

        include:
          - system: aarch64-darwin
            runs_on: macos-latest

          - system: x86_64-linux
            runs_on: ubuntu-latest

    name: '${{ matrix.system }} / ${{ matrix.nixpkg }}'
    runs-on: ${{ matrix.runs_on }}
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: 'Run Nix build for ${{ matrix.nixpkg }}'
        shell: bash
        run: nix build -L '.#${{ matrix.nixpkg }}'

      - name: 'Show result contents'
        shell: bash
        run: find result/ -type f
