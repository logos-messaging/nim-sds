name: ci / nimble
permissions:
  contents: read
on:
  pull_request:
    branches: [master, release/*]
  push:
    branches: [master, release/*]
  workflow_dispatch:

jobs:
  test:
    name: 'test / ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test suite
        run: nimble test

  build:
    name: '${{ matrix.name }} / ${{ matrix.task }}'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, runs-on: ubuntu-latest, task: libsds }
          - { name: linux, runs-on: ubuntu-latest, task: libsdsStatic }
          - { name: macos, runs-on: macos-latest, task: libsds }
          - { name: macos, runs-on: macos-latest, task: libsdsStatic }
          - { name: windows, runs-on: windows-latest, task: libsds }
          - { name: windows, runs-on: windows-latest, task: libsdsStatic }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.task }}
        env:
          NIM_PARAMS: --mm:refc --opt:size
        run: nimble ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.task }}
          path: build/lib*

  # The mobile jobs build the way an application does: the target comes from the
  # caller, and nothing about it lives in sds.nimble.
  build-ios:
    name: 'ios / ${{ matrix.sdk }} ${{ matrix.arch }}'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: iphoneos, arch: arm64, min: -miphoneos-version-min=13.0 }
          - { sdk: iphonesimulator, arch: arm64, min: -mios-simulator-version-min=14.0 }
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # 'latest-stable' tracks whatever the macos-latest runner ships, so
          # this survives Xcode rotations (the runner dropped 16.2 for 26.x).
          xcode-version: 'latest-stable'

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libsdsStatic
        run: |
          flags="-arch ${{ matrix.arch }} -isysroot $(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path) ${{ matrix.min }}"
          NIM_PARAMS="--mm:refc --opt:size --os:ios --cpu:${{ matrix.arch }} --cc:clang --passC:\"$flags\" --passL:\"$flags\"" nimble libsdsStatic

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.sdk }}-${{ matrix.arch }}
          path: build/lib*

  build-android:
    name: 'android / ${{ matrix.cpu }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: arm64, triple: aarch64-linux-android }
          - { cpu: amd64, triple: x86_64-linux-android }
          - { cpu: i386, triple: i686-linux-android }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build libsds
        run: |
          cc="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.triple }}28-clang"
          NIM_PARAMS="--mm:refc --opt:size --os:android --cpu:${{ matrix.cpu }} --cc:clang --clang.exe:$cc --clang.linkerexe:$cc -d:chronicles_log_level=ERROR" nimble libsds

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.cpu }}
          path: build/lib*
