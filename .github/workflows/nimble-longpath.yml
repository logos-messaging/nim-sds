name: nimble long paths
permissions:
  contents: read
  actions: read
on:
  push:
    branches: [test/nimble-longpath-aware]
  workflow_dispatch:

jobs:
  setup:
    name: 'windows / nimble ${{ matrix.nimble }}'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        nimble: [stock-0.26.0, nim-lang-nimble-pr-1894]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: nim-lang/setup-nimble-action@v2
        with:
          nimble-version: '0.26.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download patched nimble.exe
        if: matrix.nimble == 'nim-lang-nimble-pr-1894'
        uses: actions/download-artifact@v4
        with:
          name: nimble-windows_x64.zip
          repository: nim-lang/nimble
          run-id: 38732294244
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\nimble-pr

      - name: Put patched nimble.exe first on PATH
        if: matrix.nimble == 'nim-lang-nimble-pr-1894'
        run: |
          $dir = "${{ runner.temp }}\nimble-pr"
          Expand-Archive -Path "$dir\nimble-windows_x64.zip" -DestinationPath "$dir\bin" -Force
          "$dir\bin" >> $env:GITHUB_PATH

      - name: Enable long paths
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1
          Get-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled
          git config --system core.longpaths true
          New-Item -ItemType Directory -Force -Path C:\T | Out-Null
          "TEMP=C:\T" >> $env:GITHUB_ENV
          "TMP=C:\T"  >> $env:GITHUB_ENV

      - name: Pad the profile directory
        run: |
          $profileDir = "D:\lp\" + ("p" * 100)
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          "LONG_PROFILE=$profileDir" >> $env:GITHUB_ENV

      - name: Show nimble
        run: |
          (Get-Command nimble).Source
          nimble --version

      - name: nimble setup
        run: |
          $env:USERPROFILE = $env:LONG_PROFILE
          nimble setup -l
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Longest path in pkgcache
        if: always()
        run: |
          $cache = Join-Path $env:LONG_PROFILE ".nimble\pkgcache"
          if (Test-Path $cache) {
            Get-ChildItem -LiteralPath $cache -Recurse -File -Force |
              Sort-Object { $_.FullName.Length } -Descending |
              Select-Object -First 3 @{ n = 'Length'; e = { $_.FullName.Length } }, FullName |
              Format-List
          }
